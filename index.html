  <script>
    function triggerBlobDownload(blob, filename) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
    }
    function downloadMarkdown(e, relPath, filename) {
      if (window.location.protocol === 'file:' || !window.fetch || !window.Blob) {
        return true;
      }
      if (e) e.preventDefault();
      var btn = document.getElementById('downloadMdBtn');
      var orig = btn ? (btn.getAttribute('data-orig') || btn.innerText) : '';
      if (btn) {
        btn.setAttribute('data-orig', orig);
        btn.innerText = '正在下载...';
      }
      var targetUrl = relPath;
      try { targetUrl = new URL(relPath, window.location.href).href; } catch (err) {}
      fetch(targetUrl, { cache: 'no-cache' })
        .then(function(resp) {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return resp.text();
        })
        .then(function(text) {
          var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
          triggerBlobDownload(blob, filename);
          if (btn) {
            btn.innerText = '已下载 .md';
            setTimeout(function() { btn.innerText = orig; }, 2000);
          }
        })
        .catch(function() {
          if (btn) btn.innerText = orig;
          var a = document.createElement('a');
          a.href = targetUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        });
      return false;
    }
    function fallbackCopy(text, onDone) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        if (document.execCommand('copy')) { onDone(); }
      } catch (e) {}
      document.body.removeChild(ta);
    }
    function copyCanonicalUrl(relPath, btnId, doneLabel) {
      var btn = document.getElementById(btnId);
      if (!btn) return;
      var orig = btn.getAttribute('data-orig') || btn.innerText;
      btn.setAttribute('data-orig', orig);
      var targetUrl = window.location.href;
      try {
        targetUrl = new URL(relPath, window.location.href).href;
      } catch (e) {}
      var onDone = function() {
        btn.innerText = doneLabel;
        setTimeout(function() { btn.innerText = orig; }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(targetUrl).then(onDone, function() { fallbackCopy(targetUrl, onDone); });
      } else {
        fallbackCopy(targetUrl, onDone);
      }
    }
  </script>
